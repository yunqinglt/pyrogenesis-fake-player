<!doctype html>
<meta charset="utf-8">
<title>MCP native rally point contract</title>
<pre id="result">RUNNING</pre>
<script>
function onTick() {}
const commands = [], reads = [], outsiders = new Map();
const rally = () => ({position: undefined});
const profile = () => ({rally_point: {points: [], truncated: false}});
const producer = {id:10,player:2,rallyPoint:rally(),mcpProperties:profile(),position:{x:10,z:10},
    market:{land:true},garrisonHolder:{entities:[],capacity:0}};
const source = {id:11,player:2,rallyPoint:rally(),mcpProperties:profile(),market:{land:true}};
const repair = {id:20,player:2,position:{x:30,z:40},foundation:{},garrisonHolder:{},turretHolder:{}};
const market = {id:21,player:2,position:{x:40,z:50},market:{land:true}};
const tree = {id:30,player:0,visibility:"visible",position:{x:60,z:70},template:"gaia/tree/oak",
    resourceSupply:{type:{generic:"wood",specific:"tree"}}};
const animal = {id:31,player:0,visibility:"visible",position:{x:70,z:80},template:"gaia/fauna/deer",
    speed:{walk:8},resourceSupply:{type:{generic:"food",specific:"meat"}}};
const treasure = {id:32,player:0,visibility:"visible",position:{x:80,z:90},treasure:{}};
const enemy = {id:33,player:1,visibility:"visible",position:{x:90,z:100},hitpoints:100,capturePoints:[0,100]};
const hidden = {id:34,player:1,visibility:"hidden",position:{x:999,z:999},hitpoints:100};
for (const state of [tree,animal,treasure,enemy,hidden]) outsiders.set(state.id,state);
const owned = [producer,source,repair,market];
const Engine = {
    GetPlayerID: () => 2, ConfigDB_GetValue: () => "33333333333333333333333333333333",
    PostNetworkCommand: command => commands.push(JSON.parse(JSON.stringify(command))),
    GuiInterfaceCall: (name,id) => {
        reads.push([name,id]);
        const state = outsiders.get(id);
        if (name === "MCPGetEntityProperties") {
            if (!state || state.visibility !== "visible") throw new Error("Unavailable target");
            return {};
        }
        if (name === "GetEntityState") {
            const previous = reads.at(-2);
            if (!previous || previous[0] !== "MCPGetEntityProperties" || previous[1] !== id || state.visibility !== "visible")
                throw new Error("Unguarded read");
            return state;
        }
        throw new Error("Unexpected query");
    }
};
</script>
<script src="../mcp_player/gui/session/zy_mcp_rally.js"></script>
<script src="../mcp_player/gui/session/zz_mcp_player.js"></script>
<script>
try {
    const assert = (ok,message) => {if (!ok) throw new Error(message);};
    const same = (a,b,message) => assert(JSON.stringify(a) === JSON.stringify(b),message);
    let seq = 0;
    const issue = (fields,states=owned,action="set_rally") => MCPPlayerBridge.execute(Object.assign({
        version:1,session:"33333333333333333333333333333333",id:String(++seq),action},fields),states,512);
    const rejects = (fields,states=owned,action="set_rally") => {
        const before = commands.length;
        let failed = false;
        try {issue(fields,states,action);} catch (_) {failed = true;}
        assert(failed && commands.length === before,"Invalid rally request posted a command");
    };
    const move = {type:"move",x:40,z:50};
    issue({entities:[10],orders:[move,{type:"attack_move",x:60,z:70},{type:"patrol",x:80,z:90}]});
    same(commands[0],{type:"set-rallypoint",x:40,z:50,queued:false,entities:[10],data:{command:"walk"}},
        "Rally setting issued the wrong native command");
    same(commands.slice(-3).map(c => [c.data.command,c.queued]),
        [["walk",false],["attack-walk",true],["patrol",true]],"Rally replace/queue order failed");
    assert(commands[1].data.targetClasses.attack.join() === "Unit,Structure", "Attack-move target classes missing");
    issue({entities:[10,11],orders:[move],queued:true});
    assert(commands.at(-1).queued && commands.at(-1).entities.length === 2,"Multi-owner append failed");
    issue({entities:[10],orders:[{type:"gather",target:30},{type:"gather",target:31}]});
    let data = commands.at(-2).data;
    same(data,{target:30,command:"gather",resourceType:{generic:"wood",specific:"tree"},resourceTemplate:"gaia/tree/oak"},
        "Static resource lacks native fallback metadata");
    data = commands.at(-1).data;
    assert(data.command === "gather-near-position" && !Object.hasOwn(data,"target") && data.resourceTemplate === "gaia/fauna/deer",
        "Moving resource tracks unseen future position");
    issue({entities:[10],orders:[{type:"repair",target:20},{type:"garrison",target:10},
        {type:"occupy_turret",target:20},{type:"collect_treasure",target:32},
        {type:"attack",target:33},{type:"capture",target:33}]});
    same(commands.slice(-6).map(c => c.data.command),
        ["repair","garrison","occupy-turret","collect-treasure","attack","attack"],"Native task mapping failed");
    assert(commands.at(-2).data.allowCapture === false && commands.at(-1).data.allowCapture === true,
        "Attack/capture distinction lost");
    // Capacity and unborn unit class eligibility are evaluated by the native game at birth.
    assert(commands.at(-5).data.target === 10,"Self-garrison was rejected");
    issue({entities:[10,11],orders:[{type:"trade",target:21}]});
    same(commands.slice(-2).map(c => [c.entities,c.data.source,c.data.target]),
        [[[10],10,21],[[11],11,21]],"Trade source did not follow each producer");
    issue({entities:[10]},owned,"clear_rally");
    same(commands.at(-1),{type:"unset-rallypoint",entities:[10]},"Clear did not reset native rally point");
    for (const order of [{type:"heal",target:20},{type:"gather",target:true},{type:"gather",target:2147483648},
        {type:"move",x:513,z:0},{type:"move",x:NaN,z:0},{type:"move",x:true,z:0},
        {type:"move",x:1,z:2,target:20},{type:"move",x:1},{type:"garrison",target:33},
        {type:"trade",target:10},{type:"repair",target:21},{type:"gather",target:33},
        {type:"collect_treasure",target:30},{type:"attack",target:10}])
        rejects({entities:[10],orders:[move,order]});
    const beforeRead = reads.length;
    rejects({entities:[10],orders:[move,{type:"attack",target:34}]});
    same(reads.slice(beforeRead),[["MCPGetEntityProperties",34]],"Hidden target state read before LOS authorization");
    enemy.mirage = true;
    rejects({entities:[10],orders:[{type:"attack",target:33}]});
    delete enemy.mirage;
    for (const fields of [{entities:[],orders:[move]},{entities:[10,10],orders:[move]},
        {entities:[10,999],orders:[move]},{entities:[10],orders:[]},{entities:[10],orders:Array(101).fill(move)},
        {entities:[10],orders:[move],queued:1},{entities:[10],orders:[move],raw:true}]) rejects(fields);
    rejects({entities:[10],orders:[move]},[{...producer,player:1}]);
    rejects({entities:[10],orders:[move]},[{...producer,foundation:{}}]);
    rejects({entities:[10],orders:[move]},[{...producer,rallyPoint:null}]);
    producer.mcpProperties.rally_point.points = Array(99).fill({});
    issue({entities:[10],orders:[move],queued:true});
    rejects({entities:[10],orders:[move,move],queued:true});
    producer.mcpProperties.rally_point.truncated = true;
    rejects({entities:[10],orders:[move],queued:true});
    issue({entities:[10],orders:[move]});
    issue({entities:[10]},owned,"clear_rally");
    rejects({entities:[10],orders:[move]},owned,"clear_rally");
    market.market.land = false;
    rejects({entities:[10,11],orders:[move,{type:"trade",target:21}]});
    assert(commands.every(c => ["set-rallypoint","unset-rallypoint"].includes(c.type)),
        "Rally command redirected an existing unit");
    document.getElementById("result").textContent = "PASS: native rally commands, queue/clear bounds, unborn-unit semantics, static/moving resources, capture, self-garrison, per-market trade source, atomic validation and guarded LOS";
} catch(error) {
    document.getElementById("result").textContent = "FAIL: " + error.stack;
}
</script>
